name: GitHub Actions Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Python Set Up
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Requirements Install
        run: |
          pip install -r requirements.txt
          pip install --no-deps -r requirements_no_deps.txt
          pip install pytest

      - name: Tests Run
        run: pytest -v